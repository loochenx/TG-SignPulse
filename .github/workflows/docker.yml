name: Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── PR: single-arch smoke test (fast, no QEMU, no push) ────────────────────
  test-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build — amd64 smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=pr
          cache-to: type=gha,mode=max,scope=pr

  # ── main / tag: full multi-arch build + push (skip docs-only changes) ───────
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.changed.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate release version
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import runpy

          version = runpy.run_path("tg_signer/__init__.py")["__version__"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("程序版本必须使用数字版本号 x.y.z")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              if os.environ["GITHUB_REF_NAME"] != f"v{version}":
                  raise SystemExit("发布标签必须与程序版本一致")
          print(f"Release version: {version}")
          PYTHON

      - name: Check if only docs changed
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files: $CHANGED"
          # 如果所有变更文件都是文档类，跳过镜像构建
          NON_DOCS=$(echo "$CHANGED" | grep -v -E '^(README.*|LICENSE|\.github/workflows/docker\.yml|docs/)' || true)
          if [ -z "$NON_DOCS" ] && [ -n "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Only documentation changed, skipping Docker build."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # QEMU needed only for cross-compilation (arm64 on amd64 runner).
      - name: Set up QEMU
        if: steps.changed.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changed.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.changed.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.changed.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: luochend
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build metadata
        if: steps.changed.outputs.skip != 'true'
        run: |
          echo "REPO_OWNER=${OWNER,,}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata
        if: steps.changed.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPO_OWNER }}/tg-signpulse
            luochend/tg-signpulse
          tags: |
            # 推送 v* tag 时生成版本标签，例如 v0.8.5 → v0.8.5、0.8.5
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 推送到 main 分支时打 main 标签
            type=ref,event=branch
            # 始终打 7 位短 SHA，便于追溯
            type=sha,prefix=sha-,format=short
            # 仅正式版本 tag 更新 latest，避免并行 main 构建覆盖稳定版
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        if: steps.changed.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main

  # ── Sync README to Docker Hub (runs on any README change) ──────────────────
  update-dockerhub-description:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: luochend
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: luochend/tg-signpulse
          readme-filepath: ./README.md
